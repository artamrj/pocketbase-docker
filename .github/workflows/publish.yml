name: Build immutable PocketBase image

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      pocketbase_version:
        description: Exact PocketBase version (blank selects latest stable)
        required: false
        type: string
      migrations_ref:
        description: Exact migration repository ref (blank selects default branch HEAD)
        required: false
        type: string
  repository_dispatch:
    types: [migrations-changed]
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
      - Dockerfile
      - .dockerignore
      - scripts/**
      - tests/**
      - pb_migrations/**

permissions:
  contents: read
  packages: write

concurrency:
  group: pocketbase-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'ghcr.io/artamrj/pocketbase-docker' }}
  MIGRATIONS_REPOSITORY: ${{ vars.MIGRATIONS_REPOSITORY || 'artamrj/portfolio' }}
  MIGRATIONS_SUBDIR: ${{ vars.MIGRATIONS_SUBDIR || 'pb_migrations' }}
  MIGRATIONS_URL: ${{ vars.MIGRATIONS_URL || 'https://api.github.com/repos/artamrj/portfolio/tarball' }}
  MIGRATIONS_POLICY_BASE: ${{ vars.MIGRATIONS_POLICY_BASE }}

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out image source
        uses: actions/checkout@v6

      - name: Run worker unit tests
        run: tests/worker.sh

      - name: Validate private migration configuration
        env:
          MIGRATIONS_REPO_TOKEN: ${{ secrets.MIGRATIONS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MIGRATIONS_REPO_TOKEN" ]]; then
            echo "::error::Create the MIGRATIONS_REPO_TOKEN Actions secret with read-only Contents access to $MIGRATIONS_REPOSITORY."
            exit 1
          fi
          if [[ -z "$MIGRATIONS_POLICY_BASE" ]]; then
            echo "::error::Set the MIGRATIONS_POLICY_BASE repository variable to the full one-time migration reset commit."
            exit 1
          fi

      - name: Check out pinned migration source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.MIGRATIONS_REPOSITORY }}
          ref: ${{ inputs.migrations_ref || github.event.client_payload.migrations_ref || '' }}
          token: ${{ secrets.MIGRATIONS_REPO_TOKEN }}
          path: migration-source
          fetch-depth: 0

      - name: Enforce immutable migration history
        run: |
          set -euo pipefail
          if [[ -z "$MIGRATIONS_POLICY_BASE" ]]; then
            echo "::error::Set the MIGRATIONS_POLICY_BASE repository variable to the full one-time migration reset commit."
            exit 1
          fi
          scripts/check-migration-history migration-source "$MIGRATIONS_SUBDIR" "$MIGRATIONS_POLICY_BASE"

      - name: Resolve versions and migration identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.pocketbase_version }}
        run: |
          set -euo pipefail
          requested=${REQUESTED_VERSION#v}
          if [[ -n "$requested" ]]; then
            release=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/pocketbase/pocketbase/releases/tags/v${requested}")
          else
            release=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/pocketbase/pocketbase/releases?per_page=30" \
              | jq -c 'map(select(.draft == false and .prerelease == false))[0]')
          fi
          version=$(jq -r '.tag_name' <<<"$release")
          version=${version#v}
          [[ -n "$version" && "$version" != null ]]
          zip_url=$(jq -r --arg name "pocketbase_${version}_linux_amd64.zip" \
            '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release")
          checksums_url=$(jq -r '.assets[] | select(.name == "checksums.txt") | .browser_download_url' <<<"$release")
          [[ -n "$zip_url" && "$zip_url" != null ]]
          [[ -n "$checksums_url" && "$checksums_url" != null ]]

          migrations_commit=$(git -C migration-source rev-parse HEAD)
          migrations_dir="$GITHUB_WORKSPACE/migration-source/$MIGRATIONS_SUBDIR"
          migrations_sha=$(scripts/migration-hash "$migrations_dir")
          tag="${version}-m-${migrations_sha:0:12}"
          {
            echo "version=$version"
            echo "zip_url=$zip_url"
            echo "checksums_url=$checksums_url"
            echo "migrations_commit=$migrations_commit"
            echo "migrations_sha=$migrations_sha"
            echo "migrations_dir=$migrations_dir"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Skip an image that already exists
        id: existing
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE_NAME:$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists: $IMAGE_NAME:$TAG"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify official PocketBase binary
        if: steps.existing.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          ZIP_URL: ${{ steps.identity.outputs.zip_url }}
          CHECKSUMS_URL: ${{ steps.identity.outputs.checksums_url }}
        run: |
          set -euo pipefail
          mkdir -p .build
          filename="pocketbase_${VERSION}_linux_amd64.zip"
          curl --fail --silent --show-error --location --output ".build/$filename" "$ZIP_URL"
          curl --fail --silent --show-error --location --output .build/checksums.txt "$CHECKSUMS_URL"
          expected=$(awk -v file="$filename" '$2 == file || $2 == "*" file { print $1 }' .build/checksums.txt)
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]]
          actual=$(sha256sum ".build/$filename" | cut -d ' ' -f 1)
          [[ "${actual,,}" == "${expected,,}" ]]
          unzip -q ".build/$filename" pocketbase -d .build
          chmod 0755 .build/pocketbase

      - name: Validate migration JavaScript
        if: steps.existing.outputs.skip != 'true'
        env:
          MIGRATIONS_DIR: ${{ steps.identity.outputs.migrations_dir }}
        run: |
          set -euo pipefail
          scripts/validate-migrations "$MIGRATIONS_DIR"
          mapfile -d '' files < <(find "$MIGRATIONS_DIR" -type f -name '*.js' -print0 | sort -z)
          ((${#files[@]} > 0))
          for file in "${files[@]}"; do node --check "$file"; done

      - name: Apply migrations twice to an empty database
        if: steps.existing.outputs.skip != 'true'
        env:
          MIGRATIONS_DIR: ${{ steps.identity.outputs.migrations_dir }}
        run: |
          set -euo pipefail
          data=$(mktemp -d)
          trap 'rm -rf "$data"' EXIT
          .build/pocketbase migrate up --dir="$data" --migrationsDir="$MIGRATIONS_DIR"
          .build/pocketbase migrate up --dir="$data" --migrationsDir="$MIGRATIONS_DIR"

      - name: Set up Docker Buildx
        if: steps.existing.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build final AMD64 image locally
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.identity.outputs.tag }}
          build-args: |
            POCKETBASE_VERSION=${{ steps.identity.outputs.version }}
            MIGRATIONS_COMMIT=${{ steps.identity.outputs.migrations_commit }}
            MIGRATIONS_SHA256=${{ steps.identity.outputs.migrations_sha }}
            MIGRATIONS_SUBDIR=${{ env.MIGRATIONS_SUBDIR }}
            BUILD_REVISION=${{ github.sha }}

      - name: Require final image health
        if: steps.existing.outputs.skip != 'true'
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          MIGRATIONS_TOKEN: ${{ secrets.MIGRATIONS_REPO_TOKEN }}
          MIGRATIONS_SHA: ${{ steps.identity.outputs.migrations_sha }}
          MIGRATIONS_COMMIT: ${{ steps.identity.outputs.migrations_commit }}
        run: |
          set -euo pipefail
          test -n "$MIGRATIONS_TOKEN"
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE_NAME:$TAG")" = amd64
          test "$(docker image inspect --format '{{index .Config.Labels "io.artamrj.migrations.sha256"}}' "$IMAGE_NAME:$TAG")" = "$MIGRATIONS_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "io.artamrj.migrations.commit"}}' "$IMAGE_NAME:$TAG")" = "$MIGRATIONS_COMMIT"
          runtime=$(mktemp -d)
          container=pocketbase-image-test
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$runtime"
          }
          trap cleanup EXIT
          mkdir -p "$runtime"/{data,migrations,hooks,public,secrets}
          printf '%s' "$MIGRATIONS_TOKEN" > "$runtime/secrets/github_token"
          chmod 0600 "$runtime/secrets/github_token"
          sudo chown -R 1000:1000 "$runtime"
          docker run --detach --name "$container" --platform linux/amd64 \
            --user 1000:1000 \
            --health-cmd='curl --fail http://127.0.0.1:8090/api/health' \
            --health-interval=2s --health-timeout=2s --health-retries=30 \
            -e MIGRATIONS_URL="$MIGRATIONS_URL" \
            -v "$runtime/data:/pocketbase/data" \
            -v "$runtime/migrations:/pocketbase/migrations" \
            -v "$runtime/hooks:/pocketbase/hooks" \
            -v "$runtime/public:/pocketbase/public" \
            -v "$runtime/secrets/github_token:/run/secrets/github_token:ro" \
            "$IMAGE_NAME:$TAG"
          wait_for_health() {
            for _ in {1..60}; do
              state=$(docker inspect --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container")
              if [[ "$state" == "running healthy" ]]; then return 0; fi
              if [[ "$state" == exited* || "$state" == *unhealthy ]]; then
                docker logs "$container"
                return 1
              fi
              sleep 2
            done
            docker logs "$container"
            return 1
          }
          wait_for_health
          docker restart "$container" >/dev/null
          wait_for_health

      - name: Publish immutable AMD64 image
        if: steps.existing.outputs.skip != 'true'
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: docker push "$IMAGE_NAME:$TAG"
